name: Install and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  install_and_test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel setuptools_scm build
          python -m build -nwx .
          python -m pip install --upgrade ./dist/*.whl
          python -m pip install pytest
          python -m pip install pyshacl
          python -m pip install tzdata
          python -m pip install networkx
        shell: bash
      - name: Install SPDX 3 bindings
        # The spdx-python-model bindings are built from git and their build-time
        # code generation does not currently work on Windows; install them only
        # where they build so the SPDX 3 tests run there (and are skipped elsewhere).
        if: runner.os != 'Windows'
        run: python -m pip install ".[spdx3]"
        shell: bash
      - name: Run tests
        run: pytest
      - name: Run CLI
        run: pyspdxtools -i ./tests/spdx/data/SPDXJSONExample-v2.3.spdx.json
